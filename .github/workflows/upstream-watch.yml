name: Upstream watch

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare ReSkate main with the recorded PUSH. baseline
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(tr -d '[:space:]' < UPSTREAM_BASELINE)"
          latest="$(git ls-remote https://github.com/Dingo-Shenanigans/ReSkate.git refs/heads/main | awk '{print $1}')"
          echo "baseline=${baseline}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ -n "$latest" ] && [ "$latest" != "$baseline" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update the upstream-sync issue
        if: steps.compare.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream ReSkate changes are ready for review';
            const body = [
              'The scheduled upstream watcher found a newer ReSkate `main` commit.',
              '',
              `Recorded baseline: \`${{ steps.compare.outputs.baseline }}\``,
              `Current upstream: \`${{ steps.compare.outputs.latest }}\``,
              '',
              'Review and port changes deliberately. Preserve the compatibility policy in `docs/COMPATIBILITY.md`, then update `UPSTREAM_BASELINE` in the same pull request.'
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
